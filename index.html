<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--f:"Google Sans Flex","Google Sans","Roboto Flex",Roboto,system-ui,sans-serif;--sp:cubic-bezier(.34,1.56,.64,1);--e:cubic-bezier(.2,0,0,1);--s:#fef7ff;--os:#1d1b20;--p:#6750a4;--op:#fff;color-scheme:light}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{position:relative;overflow:hidden;background:var(--s);color:var(--os);font:400 14px/1.3 var(--f);-webkit-tap-highlight-color:transparent;user-select:none}

.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

#wp{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 80% at 10% 0,var(--c1),transparent 60%),radial-gradient(90% 70% at 100% 100%,var(--c3),transparent 60%),var(--s)}
.bl{position:absolute;width:62vmax;height:62vmax;left:-20vmax;top:-26vmax;background:var(--c2);opacity:.5;border-radius:42% 58% 63% 37%/45% 38% 62% 55%;animation:sp 50s linear infinite}

/* barra de status */

/* home */

#h{color:var(--p)}#m{color:var(--t)}

/* ícones */
.app{display:grid;justify-items:center;gap:7px;padding:6px 2px;border:0;background:none;cursor:pointer;min-width:0}
.app em{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-style:normal;font-size:12px;font-weight:500}
.ic{display:grid;place-items:center;width:60px;height:60px;border-radius:36%;background:var(--b,var(--c1));color:var(--g,var(--oc1));transition:border-radius .5s var(--sp),transform .5s var(--sp)}
.t0{--b:var(--c1);--g:var(--oc1)}.t1{--b:var(--c2);--g:var(--oc2)}.t2{--b:var(--c3);--g:var(--oc3)}

#bot{display:grid;justify-items:center;gap:14px}

.qh{display:flex;justify-content:space-between;align-items:center;padding:0 6px}

#br{appearance:none;-webkit-appearance:none;flex:1;min-width:0;height:48px;margin:0;border-radius:24px;outline-offset:2px;background:linear-gradient(90deg,var(--p) var(--v,100%),var(--shh) 0)}
#br::-webkit-slider-runnable-track{height:48px;background:none}

#sty{position:absolute;z-index:8;left:0;right:0;bottom:0;margin:auto;max-width:560px;display:grid;gap:16px;padding:12px 20px 28px;border-radius:28px 28px 0 0;background:var(--sl);box-shadow:0 -8px 40px #0004;transform:translateY(105%);transition:transform .5s var(--e)}
#sty.on{transform:none}

#sw{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.sw{aspect-ratio:1;max-width:72px;margin:auto;width:100%;border:0;border-radius:50%;cursor:pointer;transition:border-radius .45s var(--sp),transform .3s var(--sp)}
.sw[aria-pressed=true]{border-radius:30%;outline:3px solid var(--p);outline-offset:3px;transform:scale(.94)}
.bg{display:flex;gap:2px}
.bg button{flex:1;height:48px;border:0;border-radius:8px;background:var(--shh);font-weight:600;cursor:pointer;transition:border-radius .45s var(--sp),background .2s}

.bg button[aria-pressed=true]{background:var(--p);color:var(--op);border-radius:24px}
#win{position:fixed;inset:0;z-index:9;display:none;padding-top:env(safe-area-inset-top,0px);background:var(--s)}

#win b{font-size:32px;color:var(--os)}
.big{width:120px;height:120px}.big .i{width:56px;height:56px}
#dim{position:fixed;inset:0;z-index:99;background:#000;opacity:0;pointer-events:none}
#home{z-index:auto}#bot{position:relative;z-index:850}#bar{z-index:860}#scr{z-index:900}#dr{z-index:901}#sty{z-index:902}#qs{z-index:903}#dim{z-index:9997}
.ic,.t,.ib,.k,.bg button,.fab,.cb,.ib2b{position:relative;overflow:hidden}
.rp{position:absolute;border-radius:50%;background:currentColor;opacity:.2;transform:scale(0);pointer-events:none;animation:rp .65s var(--e) forwards}

.app{position:relative;animation:pop .6s var(--sp) both;animation-delay:calc(var(--d,0)*40ms)}

<script>
const $=s=>document.querySelector(s),R=document.documentElement;
const DK=()=>document.body.classList.contains('dk');let MP=null;
const A=[['Telefone','phone'],['Mensagens','chat'],['Câmera','cam'],['Navegador','globe'],['Fotos','img'],['Música','music'],['Mapas','pin'],['E-mail','mail'],['Agenda','cal'],['Relógio','clock'],['Calculadora','calc'],['Arquivos','folder'],['Configurações','gear'],['Vídeos','vid'],['Notas','note'],['Clima','cloud'],['Gravador','mic'],['Contatos','user'],['TikTok','tt'],['Play Store','store'],['Firefox','ff'],['WhatsApp','wa'],['Poki Jogos','poki'],['Roblox','rbx'],['Minecraft','mc'],['Lume AE','ai']];

/* Cor dinâmica: papéis M3 a partir de paletas tonais (aproximação em OKLCH) */
const V=[[.1,.045,.07,0,0,60],[.2,.08,.13,0,0,45],[.13,.07,.12,-90,15,60]];
const M={d:{s:'N6',sl:'N10',sm:'N12',sh:'N17',shh:'N22',os:'N90',ov:'V80',ol:'V60',p:'P80',op:'P20',c1:'P30',oc1:'P90',c2:'S30',oc2:'S90',c3:'T30',oc3:'T90',t:'T80'},
l:{s:'N98',sl:'N96',sm:'N94',sh:'N92',shh:'N90',os:'N10',ov:'V30',ol:'V50',p:'P40',op:'P100',c1:'P90',oc1:'P10',c2:'S90',oc2:'S10',c3:'T90',oc3:'T10',t:'T40'}};
let hue=285,vi=0,dark=true;
const Lk=t=>t>8?(t+16)/116:Math.cbrt(t/903.3);
function paint(){
 const[a,b,c,x,y,z]=V[vi],q={P:[a,x],S:[b,y],T:[c,z],N:[vi==5?0:.012,0],V:[vi==5?0:.022,0]};
 for(const[k,s]of Object.entries(M[dark?'d':'l'])){const[C,r]=q[s[0]];R.style.setProperty('--'+k,`oklch(${Lk(+s.slice(1)).toFixed(3)} ${C} ${(hue+r+360)%360})`)}
 R.dataset.theme=dark?'dark':'light';mark()}

 document.querySelectorAll('.sw').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.h==hue));
 document.querySelectorAll('#vg button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.v==vi));

 const t=$('[data-q="4"]');t.setAttribute('aria-pressed',dark);t.querySelector('small').textContent=dark?'Escuro':'Claro'}

/* Interface */

$('#dock').innerHTML=[0,1,3,2].map(i=>app(i,0)).join('')+`<button class="app" id="all" aria-label="Todos os apps"><span class="ic">${ic('apps')}</span></button>`;
const Q=[['Wi-Fi','wifi',1,'Conectado','Desativado'],['Bluetooth','bt',0,'Ativado','Desativado'],['Lanterna','flash',0,'Ligada','Desligada'],['Modo avião','plane',0,'Ativado','Desativado'],['Tema','moon',0,'Escuro','Claro'],['Economia','batt',0,'Ativada','Desativada'],['Desktop','vid',0,'Ativado','Desativado'],['Bloquear','power',0,'Bloqueado','Bloquear']];
$('#tl').innerHTML=Q.map((q,i)=>`<button class="t" data-q="${i}" aria-pressed="${!!q[2]}">${ic(q[1])}<span>${q[0]}<small>${q[2]?q[3]:q[4]}</small></span></button>`).join('');
$('#sw').innerHTML=[265,305,350,25,60,105,150,195].map((h,i)=>`<button class="sw" data-h="${h}" aria-label="Cor ${i+1}" style="background:conic-gradient(from 45deg,oklch(.66 .13 ${h}) 0 50%,oklch(.87 .05 ${h}) 0 75%,oklch(.83 .08 ${h+60}) 0)"></button>`).join('');
$('#vg').innerHTML=['Tonal','Vibrante','Expressivo'].map((n,i)=>`<button data-v="${i}">${n}</button>`).join('');
$('#mg').innerHTML=['Claro','Escuro'].map((n,i)=>`<button data-m="${i}">${n}</button>`).join('');
const sorted=A.map((_,i)=>i).sort((a,b)=>A[a][0].localeCompare(A[b][0],'pt'));
const fill=(f='')=>{$('#dg').innerHTML=sorted.filter(i=>A[i][0].toLowerCase().includes(f.trim().toLowerCase())).map(i=>app(i)).join('')||'<p class="em">Nenhum app encontrado</p>'};

const sh=(id,on=1)=>{$('#'+id).classList.toggle('on',!!on);$('#scr').classList.toggle('on',!!on&&id!='dr')};
const closeAll=()=>['dr','qs','sty'].forEach(i=>sh(i,0));
const op=id=>{closeAll();sh(id)};
const drawer=f=>{closeAll();$('#q').value='';fill();sh('dr');if(f)setTimeout(()=>$('#q').focus(),300)};

/* Abrir app: transição de contêiner a partir do ícone */
const ins=r=>`inset(${r.top}px ${innerWidth-r.right}px ${innerHeight-r.bottom}px ${r.left}px round 28px)`,FULL='inset(0px 0px 0px 0px round 0px)';
function launch(i,el){
 if(A[i][1]=='gear')return openSet('look');
 closeAll();const[n,g]=A[i],r=el.getBoundingClientRect(),w=$('#win');
 w.innerHTML=`<header><button class="ib" aria-label="Voltar" onclick="back()">${ic('back')}</button><h2>${n}</h2></header><main><span class="ic big t${i%3}">${ic(g)}</span><b>${n}</b><span>Aberto pela launcher. Use Esc ou Voltar.</span></main>`;
 w.style.display='block';w._r=r;
 w.animate([{clipPath:ins(r),opacity:.3},{clipPath:FULL,opacity:1}],{duration:620,easing:'cubic-bezier(.16,1,.3,1)'})}
function back(){const w=$('#win');w.animate([{clipPath:FULL,opacity:1},{clipPath:ins(w._r),opacity:0}],{duration:380,easing:'cubic-bezier(.3,0,.8,.15)'}).onfinish=()=>w.style.display='none'}

document.addEventListener('click',e=>{
 const c=s=>e.target.closest(s);let b;
 if(b=c('.app')){if(b.dataset.i)return launch(+b.dataset.i,b);return $('#dr').classList.contains('on')?closeAll():drawer()}
 if(c('#sb'))return drawer(1);
 if(c('#st'))return op('qs');
 if(c('#pl'))return openSet('look');
 if(c('#scr')||c('#hd'))return closeAll();
 if(b=c('.sw')){hue=+b.dataset.h;return paint()}
 if(b=c('#vg button')){vi=+b.dataset.v;return paint()}
 if(b=c('#mg button')){dark=!!+b.dataset.m;return paint()}
 if(b=c('.t')){const i=+b.dataset.q;if(i==4){dark=!dark;return paint()}
  const on=b.getAttribute('aria-pressed')!='true';b.setAttribute('aria-pressed',on);b.querySelector('small').textContent=Q[i][on?3:4]}
});
$('#home').oncontextmenu=e=>{e.preventDefault();openSet('look')};
$('#q').oninput=e=>fill(e.target.value);
$('#q').onkeydown=e=>{if(e.key=='Enter'){const b=$('#dg .app');b&&b.click()}};
$('#br').oninput=e=>{const v=e.target.value;e.target.style.setProperty('--v',v+'%');$('#dim').style.opacity=(100-v)*.007};
onkeydown=e=>{
 const w=$('#win').style.display=='block';
 if(e.key=='Escape')return w?back():closeAll();
 if(!w&&e.key.length==1&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!$('#dr').classList.contains('on')){drawer();$('#q').focus()}};

/* Relógio, data e bateria */
function tick(){
 const d=new Date(),p=n=>String(n).padStart(2,0),h=d.getHours(),f=o=>new Intl.DateTimeFormat('pt-BR',o).format(d);
 $('#h').textContent=p(h);$('#m').textContent=p(d.getMinutes());$('#tm').textContent=p(h)+':'+p(d.getMinutes());
 $('#dt').textContent=f({weekday:'short',day:'numeric',month:'short'});
 $('#qd').textContent=f({weekday:'long',day:'numeric',month:'long'});
 $('#gr').innerHTML=ic(h>5&&h<18?'sun':'moon')+(h<12?'Bom dia':h<18?'Boa tarde':'Boa noite')}
tick();setInterval(tick,1e4);

/* ===== v2: janelas, Sair/Abrir, animações e apps funcionais ===== */
const $$=s=>document.querySelectorAll(s),pad=(n,l=2)=>String(n).padStart(l,0);
let AC;const ac=()=>AC=AC||new(window.AudioContext||webkitAudioContext)();
const tone=(f,d=.12,t=0,v=.2,ty='sine',dst)=>{const c=ac(),o=c.createOscillator(),g=c.createGain(),n=c.currentTime+t;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v,n+.01);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(dst||c.destination);o.start(n);o.stop(n+d+.05)};
const LS={g:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(_){return d}},s:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ondulação M3 nos botões */
document.addEventListener('pointerdown',e=>{return;const t=e.target.closest('.ic,.t,.ib,.k,.bg button,.fab,.cb,.ib2b');if(!t)return;const r=t.getBoundingClientRect(),s=Math.max(r.width,r.height)*2,d=document.createElement('i');d.className='rp';d.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;t.appendChild(d);setTimeout(()=>d.remove(),650)});
/* entrada escalonada dos ícones */
const stag=()=>['#grid','#dock','#dg'].forEach(s=>$$(s+' .app').forEach((b,i)=>b.style.setProperty('--d',i)));
stag();new MutationObserver(stag).observe($('#dg'),{childList:true});
/* dígitos do relógio rolam ao mudar */
['#h','#m'].forEach(s=>{const e=$(s);let v=e.textContent;new MutationObserver(()=>{if(e.textContent!=v){v=e.textContent;e.animate([{transform:'translateY(-40%)',opacity:0},{transform:'none',opacity:1}],{duration:600,easing:'cubic-bezier(.34,1.56,.64,1)'})}}).observe(e,{childList:true,characterData:true,subtree:true})});

/* progresso ondulado (M3 Expressive): ondula ao tocar, achata ao pausar */
function wave(s){s.innerHTML='<path class="wt"/><path class="wa"/>';const[t,a]=s.children;let ph=0,am=0;const f=()=>{if(!s.isConnected)return;const r=s.getBoundingClientRect(),w=r.width||300,h=r.height||16,x1=w*(+s.dataset.p||0);am+=((+s.dataset.a||0)-am)*.08;ph+=.14*am;let d='';for(let x=4;x<=x1-4;x+=3)d+=(d?'L':'M')+x+' '+(h/2+Math.sin(x/9-ph)*4*am).toFixed(1);a.setAttribute('d',d||'M0 0');t.setAttribute('d','M'+Math.min(Math.max(x1,4)+8,w-4)+' '+h/2+'H'+(w-4));requestAnimationFrame(f)};f()}
function dlg(t,m,bs){const s=document.createElement('div');s.className='dg2';s.innerHTML=`<div class="dc"><h3>${t}</h3><p>${m}</p><div class="da">${bs.map((x,i)=>`<button class="ib2" data-k="${i}">${x[0]}</button>`).join('')}</div></div>`;document.body.append(s);s.onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;s.remove();(bs[b.dataset.k][1]||(()=>{}))()}}

/* ---- janelas ---- */
const WZ={z:10,w:{}},APPS={};
const rectOf=i=>{const b=(DK()&&document.querySelector(`#tb [data-i="${i}"] .ic`))||document.querySelector(`#dock [data-i="${i}"] .ic`)||document.querySelector(`#grid [data-i="${i}"] .ic`);return b?b.getBoundingClientRect():new DOMRect(innerWidth/2-30,innerHeight-90,60,60)};
const cf=(r,b,q=28)=>`inset(${r.top-b.top}px ${b.right-r.right}px ${b.bottom-r.bottom}px ${r.left-b.left}px round ${q}px)`;
const runs=()=>$$('.app[data-i]').forEach(b=>{const w=WZ.w[b.dataset.i];b.classList.toggle('run',!!w);b.classList.toggle('mn',!!(w&&w.mn))});
const foc=w=>{w.e.style.zIndex=++WZ.z;w.e.style.setProperty('--z2',880+WZ.z);$$('.wn').forEach(x=>x.classList.toggle('bk',x!==w.e));runs()};
function shut(w){const e=w.e,b=e.getBoundingClientRect();delete WZ.w[w.i];runs();w.off.forEach(f=>f());if(w.mn){e.remove();return}e.style.pointerEvents='none';e.animate([{clipPath:cf(b,b),opacity:1},{clipPath:cf(rectOf(w.i),b,26),opacity:0}],{duration:440,easing:'cubic-bezier(.3,0,.8,.15)',fill:'forwards'}).onfinish=()=>e.remove()}
function mini(w){const e=w.e,b=e.getBoundingClientRect();w.mn=1;runs();e.animate([{clipPath:cf(b,b),opacity:1},{clipPath:cf(rectOf(w.i),b,26),opacity:0}],{duration:380,easing:'cubic-bezier(.3,0,.8,.15)',fill:'forwards'}).onfinish=()=>{e.style.display='none'}}
function unmin(w){const e=w.e;w.mn=0;e.style.display='flex';e.getAnimations().forEach(a=>a.cancel());foc(w);const b=e.getBoundingClientRect();e.animate([{clipPath:cf(rectOf(w.i),b,26),opacity:.2},{clipPath:cf(b,b),opacity:1}],{duration:520,easing:'cubic-bezier(.2,0,0,1)'})}
function mxz(w){const e=w.e,a=e.getBoundingClientRect();e.classList.toggle('mx');const b=e.getBoundingClientRect();e.animate([{transformOrigin:'0 0',transform:`translate(${a.left-b.left}px,${a.top-b.top}px) scale(${a.width/b.width},${a.height/b.height})`},{transformOrigin:'0 0',transform:'none'}],{duration:480,easing:'cubic-bezier(.34,1.3,.64,1)'})}
function launch(i,el){
 const[n,g]=A[i];
 const src=(el.querySelector('.ic')||el).getBoundingClientRect();closeAll();
 let w=WZ.w[i];if(w){w.mn?unmin(w):foc(w);return}
 const e=document.createElement('div'),k=Object.keys(WZ.w).length%4;
 e.className='wn';e.tabIndex=-1;
 e.innerHTML=`<div class="wh"><span class="ic t${i%3}">${ic(g)}</span><h2>${n}</h2><button class="ib" data-a="mn" aria-label="Minimizar">${ic('min')}</button><button class="ib" data-a="mx" aria-label="Maximizar">${ic('max')}</button><button class="ib x" data-a="x" aria-label="Sair">${ic('close')}<span>Sair</span></button></div><div class="wb"></div>`;
 if(DK()){const W=Math.min(440,innerWidth-32),H=Math.min(680,innerHeight-170);Object.assign(e.style,{width:W+'px',height:H+'px',left:Math.max(8,Math.min(innerWidth-W-8,(innerWidth-W)/2+k*36-54))+'px',top:Math.max(62,(innerHeight-H)/2+k*32-40)+'px'})}else e.classList.add('mx');
 w=WZ.w[i]={e,i,off:[]};document.body.append(e);foc(w);
 const b=e.getBoundingClientRect(),mx=e.classList.contains('mx');
 e.animate([{clipPath:cf(src,b,26),opacity:.2},{clipPath:cf(b,b,mx?0:28),opacity:1}],{duration:620,easing:'cubic-bezier(.2,0,0,1)'});
 const body=e.querySelector('.wb');(APPS[g]||APPS._)(body,w,n,g);
 body.animate([{opacity:0,transform:'translateY(18px)'},{opacity:1,transform:'none'}],{duration:500,delay:200,easing:'cubic-bezier(.2,0,0,1)',fill:'backwards'});
 e.onpointerdown=()=>foc(w);e.focus({preventScroll:true});
 const h=e.querySelector('.wh');
 h.onpointerdown=ev=>{if(ev.target.closest('button')||e.classList.contains('mx'))return;const r=e.getBoundingClientRect(),dx=ev.clientX-r.left,dy=ev.clientY-r.top;h.setPointerCapture(ev.pointerId);h.onpointermove=m=>{e.style.left=Math.min(innerWidth-96,Math.max(96-r.width,m.clientX-dx))+'px';e.style.top=Math.min(innerHeight-56,Math.max(0,m.clientY-dy))+'px'};h.onpointerup=()=>h.onpointermove=null};
 h.ondblclick=ev=>{if(!ev.target.closest('button')&&DK())mxz(w)}}
